plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

/**
 * Release signing is read from local.properties (git-ignored) or environment
 * variables — never hard-coded here, so credentials cannot leak into git.
 *
 *   local.properties:
 *     RELEASE_STORE_FILE=release.keystore
 *     RELEASE_STORE_PASSWORD=...
 *     RELEASE_KEY_ALIAS=...
 *     RELEASE_KEY_PASSWORD=...
 */
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def signingValue = { String key, String envName ->
    localProps.getProperty(key) ?: System.getenv(envName)
}

/** Short git SHA for BuildConfig, "unknown" when git is unavailable. */
def gitSha = {
    try {
        return 'git rev-parse --short HEAD'.execute([], rootProject).text.trim()
    } catch (Exception ignored) {
        return 'unknown'
    }
}

/** ISO-8601-ish build timestamp for BuildConfig. */
def buildTime = {
    return new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
}

def releaseStoreFile = signingValue('RELEASE_STORE_FILE', 'RELEASE_STORE_FILE')
def hasReleaseKeystore = releaseStoreFile != null && file(releaseStoreFile).exists()

android {
    namespace 'com.nekogps.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.nekogps.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.4.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Exposed via BuildConfig for the About screen / bug reports.
        buildConfigField "String", "GIT_SHA", "\"${gitSha()}\""
        buildConfigField "String", "BUILD_TIME", "\"${buildTime()}\""
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue('RELEASE_STORE_PASSWORD', 'RELEASE_STORE_PASSWORD')
                keyAlias signingValue('RELEASE_KEY_ALIAS', 'RELEASE_KEY_ALIAS')
                keyPassword signingValue('RELEASE_KEY_PASSWORD', 'RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*']
        }
    }

    // Lint is a shipping gate, not a suggestion. The project is currently
    // lint-clean, so any new finding fails the build outright.
    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        htmlReport true
        xmlReport true
        textReport true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

kapt {
    correctErrorTypes = true
    arguments {
        // Room schema export — keeps migrations reviewable in git.
        arg('room.schemaLocation', "$projectDir/schemas")
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.4"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.4"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.2"

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Location & GPS
    implementation 'com.google.android.gms:play-services-location:20.0.0'

    // OpenStreetMap
    implementation 'org.osmdroid:osmdroid-android:6.1.17'

    // Room — kapt is REQUIRED for Kotlin entities/DAOs to generate *_Impl classes.
    // 2.6.1+ is required for Kotlin 1.9 metadata; 2.5.x cannot parse it and
    // mis-reads `suspend` DAO functions as returning java.lang.Object.
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Splash screen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // RecyclerView
    implementation "androidx.recyclerview:recyclerview:1.3.1"

    // CardView
    implementation "androidx.cardview:cardview:1.0.0"

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
