# ── JVM ───────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# ── Gradle behaviour ──────────────────────────────────────────────────────────
# Parallel + caching make local iteration much faster. The Gradle daemon is kept
# on by default; CI should pass --no-daemon explicitly.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true

# Jetifier rewrites legacy support-library bytecode at build time. Nothing in the
# dependency graph needs it, and it slows builds down measurably — keep it off
# and re-enable only if a new dependency demands it.
android.enableJetifier=false

# Faster resources, smaller R classes, less incremental churn.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlin.code.style=official
kapt.incremental.apt=true
kapt.use.worker.api=true
